name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest app and the messages that trigger the bug.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: MQute, Python, paho-mqtt and broker (e.g. Mosquitto 2.0.18, HiveMQ Cloud)
    validations:
      required: true
