name: Feature / task
description: Propose new work. Every change starts as an issue.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you suggest. Code snippets welcome.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How do we know it is finished? (tests, docs, examples)
